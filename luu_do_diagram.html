  <!-- Supporting engines -->
  <rect x="38" y="1320" width="2484" height="424" rx="20" fill="#ffffff" stroke="#dbe4ee" stroke-width="2"/>
  <text x="66" y="1360" font-size="22" font-weight="900" fill="#0f172a">CÁC BỘ MÁY CHẠY SONG SONG XUYÊN SUỐT VÒNG ĐỜI HỒ SƠ</text>
  <text x="66" y="1386" font-size="14" font-weight="600" fill="#64748b">Các luồng này không thay thế trạng thái phê duyệt; chúng hỗ trợ cấu hình, lưu bằng chứng, cảnh báo và truy vết.</text>

  <foreignObject x="62" y="1414" width="570" height="286"><div xmlns="http://www.w3.org/1999/xhtml" class="support-card" style="border-color:#60a5fa;background:#eff6ff"><div class="support-title">A. Admin Config Engine</div><ul><li>Quản lý Cụm, Chi nhánh, PGD, User và role/scope.</li><li>Publish phiên bản Kênh, Schema, Workflow, SLA và Email.</li><li>Hồ sơ đã tạo ghim đúng phiên bản cấu hình đã publish.</li><li>Không tham gia phê duyệt nghiệp vụ nếu không được cấp quyền riêng.</li></ul><div class="support-note">Cấu hình tác động trước khi hồ sơ được khởi tạo.</div></div></foreignObject>
  <foreignObject x="660" y="1414" width="590" height="286"><div xmlns="http://www.w3.org/1999/xhtml" class="support-card" style="border-color:#fbbf24;background:#fffbeb"><div class="support-title">B. SLA &amp; Escalation</div><ul><li>Khởi tạo cùng lúc hồ sơ được giao việc; dừng khi hoàn tất.</li><li>Còn &gt;3 ngày: Xanh • Còn 1-3 ngày: Vàng + nhắc việc.</li><li>Quá hạn: <b>slaStatus = OVERDUE</b>, workflowStatus không đổi.</li><li>Gia hạn phải có đề nghị, phê duyệt và lưu hạn cũ/mới.</li></ul><div class="support-note">Worker chạy 08:30 theo múi giờ Asia/Ho_Chi_Minh.</div></div></foreignObject>
  <foreignObject x="1278" y="1414" width="590" height="286"><div xmlns="http://www.w3.org/1999/xhtml" class="support-card" style="border-color:#2dd4bf;background:#f0fdfa"><div class="support-title">C. Kho minh chứng / Google Drive mục tiêu</div><ul><li>Cây lưu trữ: Chuyên đề/Khách hàng/CIF/Mã lỗi.</li><li>Lưu metadata, checksum, người tải, thời điểm và phiên bản file.</li><li>Chi nhánh bổ sung khi PENDING/REJECTED; khóa sau khi nộp.</li><li>Local hiện lưu binary trên đĩa; production phải nghiệm thu Drive thật.</li></ul><div class="support-note">Mọi thao tác file đều phát sinh Audit Event.</div></div></foreignObject>
  <foreignObject x="1896" y="1414" width="600" height="286"><div xmlns="http://www.w3.org/1999/xhtml" class="support-card" style="border-color:#a78bfa;background:#f5f3ff"><div class="support-title">D. Audit Trail &amp; Notification Outbox</div><ul><li>Ghi append-only: ai, lúc nào, role/scope, hành động, trước/sau.</li><li>Lưu lý do trả về, kết quả kiểm soát và căn cứ đóng lỗi.</li><li>Email/thông báo có outbox, retry, chống gửi trùng và delivery log.</li><li>Dashboard đọc từ dữ liệu đã áp scope, không lọc bảo mật ở UI.</li></ul><div class="support-note">Audit Trail tồn tại từ staging đến khi lưu trữ hồ sơ.</div></div></foreignObject>
